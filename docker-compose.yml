services:
  mysql:
    image: mysql:${MYSQL_VERSION}
    container_name: connectify-mysql

    ports:
      - "${MYSQL_PORT}:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    volumes:
      - mysql-data:/var/lib/mysql

    restart: unless-stopped

volumes:
  mysql-data: